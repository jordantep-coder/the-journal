[build]
  command = "npm run build"
  publish = "dist"

# React Router uses client-side routing (BrowserRouter) — without this,
# refreshing or deep-linking to e.g. /trades/new 404s on Netlify's static
# file server, since there's no trades/new.html file to serve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
